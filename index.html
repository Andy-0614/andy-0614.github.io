<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>你的網頁標題</title>
        
        <!-- Open Graph Meta Tags -->
        <!-- 設定分享時顯示的網頁標題 -->
        <meta property="og:title" content="你的網頁標題">
        
        <!-- 設定分享時顯示的網頁描述 -->
        <meta property="og:description" content="請在這裡輸入一段吸引人的網頁內容描述。">
        
        <!-- 設定分享時顯示的預覽圖片（使用你提供的圖片網址） -->
        <meta property="og:image" content="https://www.image2url.com/r2/default/images/1787884981055-5285ff65-dc13-4c8c-9308-7c4b04e246eb.png">
        
        <!-- 設定網頁的標準網址 -->
        <meta property="og:url" content="https://你的網站網址.com">
        
        <!-- 設定網頁類型（通常一般網頁填寫 website，文章填寫 article） -->
        <meta property="og:type" content="website">
    </head>
    <body>
        <!-- 網頁內容寫在這裡 -->
    </body>
</html>
